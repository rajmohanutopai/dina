# Clean-install end-to-end: onboard a fresh Dina, then run the guided demo and
# Exit. Verifies the whole first-run path on a real device.
#
# Robust input notes (learned on iOS 26.4 sim):
#  - handle: synthetic typing into the handle field is flaky; tap an available
#    suggestion by its real testID (handle-suggestion-<handle>) instead.
#  - passphrase confirm: a synthetic tap does NOT focus the 2nd secure field;
#    use the keyboard "Next" key (returnKeyType=next + onSubmitEditing ref focus)
#    to move from passphrase -> confirm, then type.
#  - dev build: dismiss the Expo dev-menu (tap outside) before running.
appId: com.dinakernel.mobile
---
- launchApp:
    stopApp: true
# Dev-build only: dismiss the Expo dev-menu intro if it's covering the welcome
# screen (tap its Continue, then tap outside the panel). No-ops on a clean
# welcome (optional tap + a harmless tap on the top status area).
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    point: '50%,12%'
- tapOn:
    id: 'shell-primary'
- tapOn:
    id: 'mode-choice-card-create-a-new-dina'
- tapOn:
    id: 'owner-name-input'
- inputText: 'Alonso'
# Android 17 can interpret Maestro's hideKeyboard as Back after direct text
# injection. Submit through the field's real "Done" action instead.
- pressKey: Enter
# Handle: prefilled "alonso" (taken from prior runs) → use an available suggestion.
- extendedWaitUntil:
    visible:
      id: 'handle-suggestion-.*'
    timeout: 25000
- tapOn:
    id: 'handle-suggestion-.*'
- extendedWaitUntil:
    visible:
      id: 'handle-status-available'
    timeout: 20000
- tapOn:
    id: 'shell-primary'
# Passphrase via the keyboard "Next" chain (the new ref-focus fix).
- tapOn:
    id: 'passphrase-input'
- inputText: 'dinatestpassword'
- pressKey: Enter
- inputText: 'dinatestpassword'
- tapOn:
    text: 'This encrypts your vault.*'
- tapOn:
    id: 'shell-primary'
# Recovery reveal/verify removed from onboarding (silent phrase + deferred
# backup prompt) — the passphrase step now goes straight to "Connect your AI".
# Mandatory "Connect your AI" step. Gemini is auto-connected via the dev env
# key (EXPO_PUBLIC_DINA_DEV_GEMINI_API_KEY), so it shows the connected state →
# Continue. (In production with no key, the user picks a provider + pastes one.)
- extendedWaitUntil:
    visible:
      id: 'onboarding-ai-connected'
    timeout: 20000
- assertVisible:
    text: '.*connected.*'
- tapOn:
    id: 'shell-primary'
# First-run → guided demo entry → run demo → Exit (verify banner clears fast)
- extendedWaitUntil:
    visible:
      id: 'guided-demo-entry'
    timeout: 90000
- assertVisible:
    text: 'See Dina in action'
- tapOn:
    id: 'guided-demo-start'
- extendedWaitUntil:
    visible:
      id: 'guided-demo-banner'
    timeout: 15000
- assertVisible:
    id: 'guided-demo-next'
- tapOn:
    id: 'guided-demo-next'
# Step 1 (remember_people) is a SCRIPTED multi-remember: it posts "Emma is my
# daughter…" then, after a pause, "Alonso… cold brew", each with a "Stored in
# General vault." reply (see src/guided_demo/content.ts + providers.ts — the tour
# posts deterministic replies, it does NOT call the live LLM). Both bubbles being
# on screen together is the evidence the step ran AND that a multi-message step
# keeps all its bubbles. The stage-clear behaviour across steps is exercised by
# guided_demo/stage_clear.yaml (which runs this flow first).
- extendedWaitUntil:
    visible:
      text: '.*Emma is my daughter.*'
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: '.*cold brew.*'
    timeout: 30000
- assertVisible:
    text: '.*Stored in General vault.*'
# Exit + cleanup is verified by guided_demo/exit_cleanup.yaml (a fresh Maestro
# session — the long LLM-heavy session here destabilises the XCUITest driver,
# so the teardown tap is run separately for reliability).
