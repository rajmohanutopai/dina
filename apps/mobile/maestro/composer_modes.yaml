# Composer modes (docs/COMPOSER_MODES_DESIGN.md) — the 6-chip strip + Talk nav.
#
# Pure-Maestro portion: assert the stable explicit-mode chips render. A paired
# agent inserts Task before Services, which can move Reviews beyond the clipped
# edge; the hybrid runner scrolls and verifies Reviews + Talk independently.
#
# Talk is the 6th chip and is CLIPPED off the right edge of the strip at rest.
# Maestro's swipe/scrollUntilVisible cannot drive this small RN horizontal
# ScrollView (verified: only an OS-level idb/adb swipe moves it). So Talk's
# scroll-into-view + tap + navigation assertion lives in the hybrid runner
# `run_composer_modes.sh`, which scrolls via idb (iOS) / adb (Android) and then
# runs `composer_talk_assert.yaml`. Keeping that out of THIS flow keeps it green
# and deterministic on both platforms.
appId: com.dinakernel.mobile
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "index-mode-chip-ask"
    timeout: 60000
- assertVisible:
    id: "index-mode-chip-remember"
- assertVisible:
    id: "index-mode-chip-services"
