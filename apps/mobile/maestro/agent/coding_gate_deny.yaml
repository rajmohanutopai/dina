# Cleanup/safety half of coding_gate_approval.yaml. A fresh HIGH-risk request
# must remain blocked and can be explicitly denied from the phone.
appId: com.dinakernel.mobile
---
- launchApp:
    stopApp: false
- tapOn:
    id: 'tab-activity'
- tapOn:
    id: 'filter-needs_action'
- extendedWaitUntil:
    visible:
      text: 'Agent action approval'
    timeout: 30000
- assertVisible:
    text: 'fs_destructive'
- assertVisible:
    text: 'HIGH'
- tapOn:
    id: 'approvals-deny-.*'
- extendedWaitUntil:
    visible:
      text: 'Deny "fs_destructive"?'
    timeout: 10000
- tapOn:
    text: 'Deny'
    index: 1
- extendedWaitUntil:
    notVisible:
      text: 'Agent action approval'
    timeout: 15000
- assertVisible:
    text: 'All caught up'
