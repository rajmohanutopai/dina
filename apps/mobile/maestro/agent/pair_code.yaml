# MRS-06/07/08 setup - mint a pairing code on the app for a coding agent or
# approval-phone bridge. The setup code is copied to the simulator pasteboard;
# the orchestrator must consume it without printing it.
appId: com.dinakernel.mobile
---
- launchApp
- extendedWaitUntil:
    visible:
      id: 'root-layout-boot-ready'
    timeout: 60000
- tapOn:
    id: 'root-layout-menu'
- tapOn:
    id: 'root-layout-menu-row-settings'
- scrollUntilVisible:
    element:
      id: 'settings-row-agents'
    direction: DOWN
    centerElement: true
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: 'settings-row-agents'
- scrollUntilVisible:
    element:
      id: 'paired-devices-agent-name'
    direction: DOWN
    centerElement: true
    timeout: 40000
    visibilityPercentage: 50
- tapOn:
    id: 'paired-devices-agent-name'
- eraseText
- inputText: 'maestro-approval-phone'
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: 'paired-devices-generate'
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: 'paired-devices-generate'
    # Android can consume the first tap while the TextInput relinquishes
    # focus. Retry only when the hierarchy did not change; iOS therefore
    # still generates exactly one short-lived code.
    retryTapIfNoChange: true
# Handing out authority asks for the passphrase first. Pass it with
# -e OWNER_PASSPHRASE=… (the fixture one from onboarding_create.yaml).
- extendedWaitUntil:
    visible:
      text: 'Your passphrase'
    timeout: 8000
- tapOn:
    text: 'Your passphrase'
- inputText: ${OWNER_PASSPHRASE}
- tapOn:
    text: 'Verify'
- scrollUntilVisible:
    element:
      id: 'paired-devices-setup-code'
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
# React Native's selectable Text has no dedicated copy button. Long-pressing
# opens iOS's native selection menu; Copy writes directly to the sim pasteboard.
- longPressOn:
    id: 'paired-devices-setup-code'
- extendedWaitUntil:
    visible:
      text: 'Copy'
    timeout: 5000
- tapOn:
    text: 'Copy'
