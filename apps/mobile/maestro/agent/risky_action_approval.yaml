# MRS-08 — Approvals: a HIGH-risk agent action raises an approval card in the
# Activity → Needs-action inbox, and approving it requires BOTH the inline
# Approve (card) AND a native confirm Alert (HIGH risk = "every invocation",
# no session-scope shortcut).
#
# Driven by `harness/agent_mrs_driver.sh risky`, which issues the
# `dina validate … transfer_money` BEFORE this flow (so the card is pending)
# and polls `dina validate-status <id>` AFTER → expects `approved`. The flow's
# job is the on-device half: surface the card, approve through the confirm,
# and confirm the inbox clears.
appId: com.dinakernel.mobile
---
# Foreground WITHOUT a cold restart (stopApp:false). The proposal is already
# created server-side (the driver ran `dina validate` first), so no restart
# is needed — and a cold boot races the filter tap: it fires while the app is
# still hydrating and the Activity filter resets to the default "Unread",
# leaving the (real, pending) card hidden behind the wrong filter.
- launchApp:
    stopApp: false
- tapOn:
    id: 'tab-activity'
- tapOn:
    id: 'filter-needs_action'
# The HIGH-risk intent card: headline + capability + risk tag.
- extendedWaitUntil:
    visible:
      text: 'Agent action approval'
    timeout: 25000
- assertVisible:
    text: 'transfer_money'
- assertVisible:
    text: 'HIGH'
# Inline Approve opens the native confirm Alert (no session scope for HIGH).
- tapOn:
    id: 'approvals-approve-.*'
- extendedWaitUntil:
    visible:
      text: 'Approve "transfer_money"?'
    timeout: 10000
# Two "Approve" elements are on screen now (index 0 = the card button behind
# the scrim, index 1 = the Alert's confirm). The Alert's is index 1.
- tapOn:
    text: 'Approve'
    index: 1
# The inbox clears — Needs-action returns to the "All caught up" empty state.
- extendedWaitUntil:
    notVisible:
      text: 'Agent action approval'
    timeout: 15000
- assertVisible:
    text: 'All caught up'
