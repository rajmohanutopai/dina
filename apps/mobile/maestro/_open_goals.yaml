# Sub-flow: from anywhere to the My Goals screen.
appId: com.dinakernel.mobile
---
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'root-layout-menu-row-/goals'
          commands:
            - tapOn:
                id: 'root-layout-menu'
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: 'root-layout-menu-row-/goals'
          timeout: 5000
- tapOn:
    id: 'root-layout-menu-row-/goals'
- extendedWaitUntil:
    visible:
      id: 'goals-screen'
    timeout: 20000
