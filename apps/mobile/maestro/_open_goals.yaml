# Sub-flow: from anywhere to Today, then to the Goals screen.
appId: com.dinakernel.mobile
---
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'root-layout-menu-row-/plan'
          commands:
            - tapOn:
                id: 'root-layout-menu'
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: 'root-layout-menu-row-/plan'
          timeout: 5000
- tapOn:
    id: 'root-layout-menu-row-/plan'
- extendedWaitUntil:
    visible:
      id: 'plan-screen'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'plan-goals'
    centerElement: true
- tapOn:
    id: 'plan-goals'
- extendedWaitUntil:
    visible:
      id: 'goals-screen'
    timeout: 10000
