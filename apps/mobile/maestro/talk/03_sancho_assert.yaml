# Cross-platform Talk (MRS-04) — receiver assertion (Sancho, iOS).
# After the D2D arrives + the drain runs, an ENRICHED reminder is created
# that weaves the sender's vault context (cold brew) into the arrival.
#
# Assert on the REMINDERS screen, not a chat card: the D2D drain writes the
# reminder to the reminder store (it shows in Reminders), and does NOT
# reliably post a scheduled card to the main chat thread — so the store is
# the deterministic surface. The "cold brew" payload is real-LLM enrichment,
# matched by text.
appId: com.dinakernel.mobile
---
- launchApp
- tapOn:
    id: 'root-layout-menu'
- tapOn:
    id: 'root-layout-menu-row-reminders'
# The drain runs a real LLM, so give it room.
- extendedWaitUntil:
    visible:
      text: '.*[Cc]old ?[Bb]rew.*'
    timeout: 150000
