# Vault E2E from an already-onboarded app. Creates a Standard "salon" vault,
# routes a same-session remember to it, and confirms it survives a cold restart.
#
# Robustness notes (iOS sim):
#  - nav menu is an RN <Modal> → tap rows by TEXT, not testID.
#  - below-fold taps clamp into the tab bar (phantom nav) → scrollUntilVisible
#    with centerElement before tapping growth-prone targets.
appId: com.dinakernel.mobile
---
- launchApp:
    stopApp: false
# Dismiss the guided-demo entry if present, then make sure we're on Chat (a
# prior phantom-nav may have left the app on Network).
- runFlow:
    when:
      visible:
        id: 'guided-demo-entry'
    commands:
      - tapOn:
          id: 'guided-demo-skip'
- runFlow:
    when:
      visible:
        id: 'tab-chat'
    commands:
      - tapOn:
          id: 'tab-chat'
- extendedWaitUntil:
    visible:
      id: 'index-mode-chip-remember'
    timeout: 40000

# ── Open the Vault screen (menu row is in a Modal → tap by text) ──
- tapOn:
    id: 'root-layout-menu'
- tapOn:
    text: 'Vault'
- extendedWaitUntil:
    visible:
      id: 'vault-new-vault'
    timeout: 20000

# ── Create a Standard "salon" vault ──
- scrollUntilVisible:
    element:
      id: 'vault-new-vault'
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn:
    id: 'vault-new-vault'
- extendedWaitUntil:
    visible:
      id: 'vault-name-input'
    timeout: 15000
- tapOn:
    id: 'vault-name-input'
- inputText: 'salon'
- tapOn:
    id: 'vault-tier-standard'
- scrollUntilVisible:
    element:
      id: 'vault-description-input'
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn:
    id: 'vault-description-input'
- inputText: 'My salon business: opening hours, appointments, client bookings, services and prices'
- scrollUntilVisible:
    element:
      id: 'vault-create'
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn:
    id: 'vault-create'
- extendedWaitUntil:
    visible:
      id: 'vault-open-salon'
    timeout: 20000

# ── SAME session: remember salon hours → must route to the Salon vault ──
- tapOn:
    id: 'tab-chat'
- extendedWaitUntil:
    visible:
      id: 'index-mode-chip-remember'
    timeout: 15000
- tapOn:
    id: 'index-mode-chip-remember'
- tapOn:
    id: 'chat-input'
- inputText: 'My salon is open Tuesday to Saturday, 10am to 6pm, last appointment at 5pm'
- tapOn:
    id: 'send-button'
- extendedWaitUntil:
    visible:
      text: '.*Stored in [Ss]alon [Vv]ault.*'
    timeout: 60000

# ── Cold restart: the salon vault survives (the headline fix) ──
- stopApp
- launchApp
- runFlow:
    when:
      visible:
        id: 'guided-demo-entry'
    commands:
      - tapOn:
          id: 'guided-demo-skip'
- extendedWaitUntil:
    visible:
      id: 'index-mode-chip-remember'
    timeout: 90000
- tapOn:
    id: 'root-layout-menu'
- tapOn:
    text: 'Vault'
- extendedWaitUntil:
    visible:
      id: 'vault-open-salon'
    timeout: 20000
