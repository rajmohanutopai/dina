plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.dinanet'
version = '1.0.0'

android {
  namespace "expo.modules.dinanet"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // React Native already ships OkHttp 4; this resolves to its version.
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
}
