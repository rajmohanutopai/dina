# Publish source-free native Home Node Lite releases.
#
# Each runner builds for its own platform/architecture so the bundled Node
# runtime and SQLCipher native binding always share an ABI. Release archives
# contain Core, Brain, the offline archive tool, and their exact runtime.

name: home-node-lite-release

on:
  push:
    tags: ["home-node-lite-v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version used inside validation artifacts"
        required: true
        default: "0.0.0-dev"

concurrency:
  group: home-node-lite-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tagged source to be on main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit contained in origin/main." >&2
            exit 1
          }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cli/pyproject.toml

      - name: Require release tag to match the CLI version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#home-node-lite-v}"
          cli_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path('cli/pyproject.toml').read_text(encoding='utf-8'))
          print(project['project']['version'])
          PY
          )"
          if [[ "$tag_version" != "$cli_version" ]]; then
            echo "Release tag version $tag_version does not match CLI version $cli_version." >&2
            exit 1
          fi

      - name: Verify CLI release binding
        shell: bash
        run: scripts/release/component_version.sh check cli --head

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -e "./cli[dev]"

      - name: Verify generated plugin runtimes
        run: python scripts/dev/sync-agent-plugin-runtime.py --check

      - name: Typecheck release runtime
        run: |
          npm run typecheck --workspace @dina/core
          npm run typecheck --workspace @dina/brain
          npm run typecheck --workspace @dina/home-node-lite-core-server
          npm run typecheck --workspace @dina/home-node-lite-brain-server

      - name: Test release runtime and installer
        run: |
          python -m pytest cli/tests -q
          npm test --workspace @dina/core -- --runInBand
          npm test --workspace @dina/brain -- --runInBand
          npm test --workspace @dina/home-node-lite-core-server -- --runInBand
          npm test --workspace @dina/home-node-lite-brain-server -- --runInBand

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: windows-2022
            platform: win32
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cli/pyproject.toml

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/home-node-lite-v* ]]; then
            value="${GITHUB_REF_NAME#home-node-lite-v}"
          else
            value="${{ inputs.version }}"
          fi
          if [[ ! "$value" =~ ^[A-Za-z0-9][A-Za-z0-9_.+-]{0,127}$ ]]; then
            echo "Invalid release version: $value" >&2
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: npm ci

      - name: Build native archive
        shell: bash
        run: |
          python scripts/release/build_home_node_native.py \
            --version "${{ steps.version.outputs.value }}" \
            --out-dir dist/home-node-native

      - name: Verify runner matches artifact target
        shell: bash
        run: |
          test -f "dist/home-node-native/dina-home-node-lite-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          test -f "dist/home-node-native/dina-home-node-lite-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz.sha256"

      - name: Smoke-test source-free installation
        if: matrix.platform != 'win32'
        shell: bash
        run: |
          python3 -m venv .release-venv
          .release-venv/bin/pip install --disable-pip-version-check ./cli
          export DINA_HOME_NODE_DIR="$RUNNER_TEMP/dina-home-node"
          export DINA_CONFIG_DIR="$RUNNER_TEMP/dina-cli"
          .release-venv/bin/dina --json home-node install \
            --release "${{ steps.version.outputs.value }}" \
            --bundle "dist/home-node-native/dina-home-node-lite-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" \
            --endpoint-mode test \
            > "$RUNNER_TEMP/install.json"
          .release-venv/bin/dina --json home-node status \
            > "$RUNNER_TEMP/home-node-status.json"
          .release-venv/bin/dina --json status \
            > "$RUNNER_TEMP/agent-status.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          home = json.loads((root / "home-node-status.json").read_text())
          agent = json.loads((root / "agent-status.json").read_text())
          assert home["installed"] is True
          assert home["running"] is True
          assert home["core_healthy"] is True
          assert home["brain_healthy"] is True
          assert agent["paired"] is True
          assert str(agent["did"]).startswith("did:key:")
          PY
          .release-venv/bin/dina home-node uninstall --purge-data --yes

      - name: Smoke-test source-free installation on Windows
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          python -m venv .release-venv
          .\.release-venv\Scripts\python.exe -m pip install --disable-pip-version-check .\cli
          $env:DINA_HOME_NODE_DIR = Join-Path $env:RUNNER_TEMP "dina-home-node"
          $env:DINA_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "dina-cli"
          $asset = "dist/home-node-native/dina-home-node-lite-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          .\.release-venv\Scripts\dina.exe --json home-node install `
            --release "${{ steps.version.outputs.value }}" `
            --bundle $asset `
            --endpoint-mode test | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP "install.json")
          .\.release-venv\Scripts\dina.exe --json home-node status |
            Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP "home-node-status.json")
          .\.release-venv\Scripts\dina.exe --json status |
            Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP "agent-status.json")
          @'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          home = json.loads((root / "home-node-status.json").read_text(encoding="utf-8-sig"))
          agent = json.loads((root / "agent-status.json").read_text(encoding="utf-8-sig"))
          assert home["installed"] is True
          assert home["running"] is True
          assert home["core_healthy"] is True
          assert home["brain_healthy"] is True
          assert agent["paired"] is True
          assert str(agent["did"]).startswith("did:key:")
          '@ | .\.release-venv\Scripts\python.exe -
          .\.release-venv\Scripts\dina.exe home-node uninstall --purge-data --yes

      - name: Sign native archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: dist/home-node-native/dina-home-node-lite-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

      - name: Attest native archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/home-node-native/dina-home-node-lite-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

      - name: Upload native archive
        uses: actions/upload-artifact@v4
        with:
          name: home-node-lite-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/home-node-native/dina-home-node-lite-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
            dist/home-node-native/dina-home-node-lite-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz.sha256
            dist/home-node-native/dina-home-node-lite-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz.sigstore.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish native release
    if: startsWith(github.ref, 'refs/tags/home-node-lite-v')
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download native archives
        uses: actions/download-artifact@v4
        with:
          pattern: home-node-lite-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/dina-home-node-lite-*.tar.gz
            dist/dina-home-node-lite-*.tar.gz.sha256
            dist/dina-home-node-lite-*.tar.gz.sigstore.json
