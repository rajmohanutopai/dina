# Build the React Native Web bundle for home-node-lite and run the
# Playwright smoke spec against the brain-server's /web/* route.
#
# Runs on:
#   - push to main (post-merge regression catch)
#   - pull_request when files that affect the web bundle or its serving
#     change (mobile source, brain-server routes, the web/__e2e__ tree)
#   - manual workflow_dispatch
#
# The job is structured as one ubuntu-latest runner so the Expo export
# and the Playwright smoke share a single workspace install. Chromium
# is the only browser we need — saves ~150MB of Webkit + Firefox.
#
# Owner: docs/HOME_NODE_LITE_WEB_UI_TASKS.md Phase 1.

name: ts-web-e2e

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/home-node-lite/brain-server/**"
      - "apps/home-node-lite/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/ts-web-e2e.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/home-node-lite/brain-server/**"
      - "apps/home-node-lite/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/ts-web-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ts-web-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build SPA bundle + Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cache Playwright's browser binaries — they're large enough
      # (~150MB Chromium) that downloading per-PR adds material time.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/home-node-lite/web/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npm run -w @dina/home-node-lite-web-e2e test:e2e:install

      - name: Install Playwright system deps
        # `--with-deps` in the install step covers this when a cache miss
        # populated it. On a cache hit the binaries are present but the
        # system libs may not be — run the apt step idempotently.
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Build the SPA bundle from apps/mobile. This is the "fail the
      # build if Expo web export errors" gate the Phase 1 plan asks for.
      - name: Build RNW SPA bundle
        run: npm run -w @dina/home-node-lite-web-e2e build:bundle

      - name: Run Playwright smoke spec
        run: npm run -w @dina/home-node-lite-web-e2e test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/home-node-lite/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
