# Build the React Native Web bundle for home-node-lite and run the
# Playwright smoke spec against the brain-server's /web/* route.
#
# Runs on:
#   - push to main (post-merge regression catch)
#   - pull_request when files that affect the web bundle or its serving
#     change (mobile source, brain-server routes, the web/__e2e__ tree)
#   - manual workflow_dispatch
#
# The job is structured as one ubuntu-latest runner so the Expo export
# and the Playwright smoke share a single workspace install. Chromium
# is the only browser we need — saves ~150MB of Webkit + Firefox.
#
# Owner: docs/HOME_NODE_LITE_WEB_UI_TASKS.md Phase 1.

name: ts-web-e2e

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/home-node-lite/brain-server/**"
      - "apps/home-node-lite/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/ts-web-e2e.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/home-node-lite/brain-server/**"
      - "apps/home-node-lite/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/ts-web-e2e.yml"
  workflow_dispatch:
  # Nightly live/judged functional tier (needs a Gemini key + test-fleet
  # reachability; costs money) — see the `functional-live` job below.
  schedule:
    - cron: "0 6 * * *"

concurrency:
  # Include the event name so the nightly `schedule` run (github.ref =
  # refs/heads/main) doesn't share a group with a push to main and get
  # cancelled (or cancel it). PR runs still coalesce per-ref.
  group: ts-web-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build SPA bundle + Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # CI builds the bundle in explicit steps below; the Playwright
    # globalSetup rebuilds fresh by default (so a local run can't test a
    # stale bundle), so tell it not to build a second time here.
    env:
      DINA_E2E_PREBUILT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cache Playwright's browser binaries — they're large enough
      # (~150MB Chromium) that downloading per-PR adds material time.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/home-node-lite/web/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npm run -w @dina/home-node-lite-web-e2e test:e2e:install

      - name: Install Playwright system deps
        # `--with-deps` in the install step covers this when a cache miss
        # populated it. On a cache hit the binaries are present but the
        # system libs may not be — run the apt step idempotently.
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Build the SPA bundle from apps/mobile. This is the "fail the
      # build if Expo web export errors" gate the Phase 1 plan asks for.
      - name: Build RNW SPA bundle
        run: npm run -w @dina/home-node-lite-web-e2e build:bundle

      # Native-target Metro bundle smoke. The web export above already
      # catches a portable-graph import that Metro can't resolve (e.g. a
      # `node:crypto` reaching @dina/core), but the SHIPPING app is the
      # native RN/Hermes bundle. This runs the reviewer's exact repro —
      # `expo export --platform ios` — so a native-only resolution break
      # fails CI here instead of on a device / in a reviewer's export.
      # Metro produces only the JS/Hermes bundle; no Xcode/native compile,
      # so it runs on ubuntu. Output goes to a throwaway dir.
      - name: Native bundle smoke (iOS Metro resolves the mobile + core graph)
        run: cd apps/mobile && npx expo export --platform ios --output-dir "$RUNNER_TEMP/dina-ios-bundle-smoke"

      - name: Run Playwright smoke spec
        run: npm run -w @dina/home-node-lite-web-e2e test:e2e

      # Hermetic agent-safety PR gate: the deterministic MRS-06/07/08 flows
      # (gatekeeper + workflow state machine + signed-agent perimeter) run
      # with Brain in noLlm mode — NO Gemini secret, direct assertions on
      # real Core state. Needs the autopilot bundle + test-pds reachability.
      - name: Build autopilot SPA bundle (agent PR gate)
        run: npm run -w @dina/home-node-lite-web-e2e build:bundle:e2e

      - name: Agent-safety PR gate (hermetic, no Gemini)
        run: npm run -w @dina/home-node-lite-web-e2e test:e2e:pr

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/home-node-lite/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  functional-live:
    name: Functional MRS flows (live Gemini + judge)
    # Nightly + manual only. Needs a Gemini key (secret) + test-fleet
    # reachability and costs money, so PRs stay on the hermetic smoke tier.
    # The judge calibration gate runs FIRST — if the judge can't classify
    # the golden set, the judged scenarios are untrusted and the job stops.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # DINA_E2E_LIVE_JUDGE is not sensitive. GEMINI_API_KEY is scoped to only
    # the steps that use it (below), so it is NOT in the environment of
    # `npm ci` / the bundle build, which run third-party install scripts.
    env:
      DINA_E2E_LIVE_JUDGE: "1"
      # This job builds the autopilot bundle explicitly; don't let the
      # Playwright globalSetup rebuild it a second time.
      DINA_E2E_PREBUILT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/home-node-lite/web/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npm run -w @dina/home-node-lite-web-e2e test:e2e:install

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Fail fast if no key is configured — the judged tier is meaningless
      # without one.
      - name: Require Gemini key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::error::GEMINI_API_KEY secret is not set — the functional live tier needs it."
            exit 1
          fi

      # Build the ONBOARDING-AUTOPILOT bundle (dist-e2e) — the passphrase is
      # baked in by the build:bundle:e2e script. (No secret in scope here.)
      - name: Build autopilot SPA bundle
        run: npm run -w @dina/home-node-lite-web-e2e build:bundle:e2e

      # Judge calibration is the hard gate — run it before any scenario.
      - name: Judge calibration gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run -w @dina/home-node-lite-web-e2e test:e2e:calibration

      # The functional MRS flows (live Gemini + judge + the MRS-14 log sweep).
      # Isolated mode = a fresh stack per spec, so the Brain's agentic
      # staging-drain queue can't accumulate across specs (see F3).
      - name: Functional MRS flows
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run -w @dina/home-node-lite-web-e2e test:e2e:functional:isolated

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-functional
          path: apps/home-node-lite/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
