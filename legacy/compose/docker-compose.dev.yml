# Dev overrides — mount source code, enable hot reload, verbose logging.
# Usage: docker compose -f legacy/compose/docker-compose.yml -f legacy/compose/docker-compose.dev.yml up

services:
  core:
    build:
      context: ../go-core
      dockerfile: Dockerfile
    volumes:
      - ../go-core:/src
      - ../../data:/data
    environment:
      - DINA_LOG_LEVEL=debug

  brain:
    build:
      context: ../python-brain
      dockerfile: Dockerfile
    volumes:
      - ../python-brain/src:/app/src
    environment:
      - DINA_LOG_LEVEL=debug
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8200", "--reload"]

  llm:
    ports:
      - "8080:8080"
